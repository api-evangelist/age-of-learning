aid: age-of-learning
name: Age of Learning
description: 'Age of Learning, Inc. is a Glendale, California educational technology company
  founded in 2007, best known for ABCmouse.com Early Learning Academy, a subscription digital
  curriculum for children ages 2-8, along with Adventure Academy (ages 8-13) and Mastery-branded
  school programs. It builds direct-to-consumer and school-facing learning products delivered
  through web and mobile apps (iOS and Android). Age of Learning does not publish a public
  developer API, SDK, or developer portal; this API Evangelist profile tracks the company as
  a consumer edtech provider surfaced from the ICONIQ Capital portfolio, enriched with the
  public link surface (privacy, terms, support, press, careers) and a domain-security posture
  probed from public DNS/TLS records.'
